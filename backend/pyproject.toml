[project]
name = "backend"
version = "0.1.0"
description = "Backend de Perseida (API FastAPI)"
requires-python = "==3.14.*"
dependencies = [
    "alembic==1.20.0",
    "apscheduler==3.11.3",
    "asyncpg==0.32.0",
    "fastapi==0.143.1",
    "httpx==0.28.1",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "pyjwt[crypto]==2.15.1",
    "redis==8.1.0",
    "skyfield==1.55",
    "sqlalchemy[asyncio]==2.1.4",
    "sqlmodel==0.0.48",
    "uvicorn==0.54.0",
    "websockets==17.4",
]

[dependency-groups]
dev = [
    "import-linter==2.15",
    "mutmut==3.8.1",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "respx==0.23.1",
    "ruff==0.16.10",
    "schemathesis==4.32.7",
]

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = [".venv"]

[tool.ruff.lint]
# E/W = estil PEP 8 · F = errors (imports i variables sense ús...) · I = ordre d'imports
# B = males pràctiques habituals · UP = sintaxi moderna · N = convencions de noms
# SIM = simplificacions · C90 = complexitat ciclomàtica
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^\\.venv/"]

[[tool.mypy.overrides]]
# APScheduler 3.x ships no type information.
module = ["apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=app --cov-report=term-missing"

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain does not import frameworks or drivers"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = ["fastapi", "sqlmodel", "sqlalchemy", "redis", "asyncpg", "httpx"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Application does not import infrastructure, FastAPI, Starlette or Redis"
type = "forbidden"
source_modules = ["app.application"]
forbidden_modules = ["app.infrastructure", "fastapi", "starlette", "redis"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Dependencies go infrastructure -> application -> domain"
type = "layers"
layers = ["app.infrastructure", "app.application", "app.domain"]

[tool.mutmut]
# Mutation testing del domini (ADR-0028). mutmut 3 no funciona a Windows natiu: executa'l a Docker/WSL.
# Nota: mutmut no muta constants de mòdul, cossos de classe ni f-strings, i el domini realtime
# només en té; per això genera 0 mutants (vegeu la PR: mutació manual dels mateixos punts).
source_paths = ["app/domain/realtime/"]
pytest_add_cli_args = ["--no-cov"]
pytest_add_cli_args_test_selection = ["tests/unit/domain/realtime/"]
