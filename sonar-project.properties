sonar.organization=pes2627q1-21-gei-upc
sonar.projectKey=pes2627q1-21-gei-upc_perseida
sonar.projectName=Perseida
sonar.sourceEncoding=UTF-8

# Codi font i proves del monorepo
sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests,frontend/__tests__,frontend/src
sonar.test.inclusions=backend/tests/**,frontend/__tests__/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx

# Exclusions globals d'anàlisi (dependències, fitxers generats, binaris)
sonar.exclusions=**/node_modules/**,**/.venv/**,**/__pycache__/**,frontend/coverage/**,backend/alembic/versions/**,frontend/openapi/**,frontend/assets/**

# Exclusions de cobertura de tests (components visuals i rutes segons criteris de TG-194)
sonar.coverage.exclusions=frontend/src/shared/ui/**,frontend/src/app/**

# Informes de cobertura generats per pytest i jest
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
