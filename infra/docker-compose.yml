name: perseida

services:
  reverse-proxy:
    image: jc21/nginx-proxy-manager:2.12.3
    container_name: perseida-reverse-proxy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
      - media_data:/media:ro
    networks:
      - gateway
    depends_on:
      api:
        condition: service_healthy

  api:
    image: ghcr.io/pes2627q1-21-gei-upc/perseida-api:${API_IMAGE_TAG:-latest}
    container_name: perseida-api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-perseida}
      POSTGRES_USER: ${POSTGRES_USER:-perseida}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_HOST: cache
      REDIS_PORT: 6379
      APP_ENV: ${APP_ENV:-production}
    volumes:
      - media_data:/app/media
    networks:
      - gateway
      - internal
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  db:
    image: postgis/postgis:18-3.6
    container_name: perseida-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-perseida}
      POSTGRES_USER: ${POSTGRES_USER:-perseida}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-perseida} -d ${POSTGRES_DB:-perseida}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  cache:
    image: redis:8-alpine
    container_name: perseida-cache
    restart: unless-stopped
    volumes:
      - redisdata:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  moderation:
    # Stub fins a #101 (servei Kev-4B)
    image: nginx:alpine
    container_name: perseida-moderation
    restart: unless-stopped
    profiles:
      - moderation
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  gateway:
    driver: bridge
  internal:
    driver: bridge
    internal: true

volumes:
  pgdata:
    name: perseida_pgdata
  redisdata:
    name: perseida_redisdata
  npm_data:
    name: perseida_npm_data
  npm_letsencrypt:
    name: perseida_npm_letsencrypt
  media_data:
    name: perseida_media_data
