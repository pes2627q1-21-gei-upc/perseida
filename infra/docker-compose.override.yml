services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8000}:8000"
    environment:
      APP_ENV: local
    volumes:
      - ../backend/app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  db:
    networks:
      - dev
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  cache:
    networks:
      - dev
    ports:
      - "${REDIS_PORT:-6379}:6379"

networks:
  dev:
    driver: bridge
