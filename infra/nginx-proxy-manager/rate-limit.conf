# Per-IP request limit for the public events endpoints (TG-351, task #477).
# Paste it into the "Advanced" tab of the same proxy host as `static.conf`; the zone
# `events_per_ip` (60 requests per minute per IP) is defined in `http_top.conf`.
# `$forward_scheme`, `$server` and `$port` are set by NPM from the proxy host (http, api, 8000).
# The proxy headers repeat NPM's own `include/proxy.conf`, because a custom location does not
# get them. No `add_header` here, so the server-level HSTS still applies.
location ^~ /api/events/ {
    # Burst of 20 served at once (`nodelay`); beyond it, 429 until the bucket refills (1 per second).
    limit_req zone=events_per_ip burst=20 nodelay;
    limit_req_status 429;
    error_page 429 = @events_rate_limited;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Scheme $scheme;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_pass $forward_scheme://$server:$port;
}

# RFC 9457 problem+json, the same shape as the API's errors (ADR-0018), with the stable code
# RATE_LIMITED. `$request_id` (32 hex characters) is the correlation id. `instance` is left out
# so no client-controlled text goes into the JSON. `add_header` drops the server-level headers,
# so HSTS is repeated here.
location @events_rate_limited {
    default_type application/problem+json;
    add_header Retry-After 1 always;
    add_header X-Correlation-ID $request_id always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return 429 '{"type":"about:blank","title":"Too Many Requests","status":429,"detail":"Too many requests. Please try again in a while.","code":"RATE_LIMITED","correlation_id":"$request_id"}';
}
