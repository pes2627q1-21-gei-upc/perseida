# Security headers for nginx-proxy-manager (paste each block into the "Advanced" tab of the
# matching proxy host / custom location). TG-45 hardening, see obsidian_vault/convencions/seguretat.md.
# Replace <API_ORIGIN> with the public origin of the API (e.g. https://api.perseida.example).
# `always` makes nginx send the header on error responses too.

# ---------------------------------------------------------------------------------------
# 1. API host (proxy_pass to the FastAPI container).
#    The API already sends its own headers (nosniff, CSP default-src 'none', no-store on
#    /api/auth and /api/users). Here only HSTS is added, because TLS ends in this proxy.
# ---------------------------------------------------------------------------------------
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# ---------------------------------------------------------------------------------------
# 2. Admin panel host (static bundle of the React Native Web SPA).
#    - script-src 'self': no inline script, no third-party script, no eval.
#    - style-src 'unsafe-inline': react-native-web injects its styles at runtime.
#    - frame-src: only the APOD video players. Adjust if the video hosts change.
#    - tokens live in sessionStorage (ADR-0008): this policy is what keeps scripts away.
# ---------------------------------------------------------------------------------------
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' <API_ORIGIN>; frame-src https://www.youtube.com https://apod.nasa.gov; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# ---------------------------------------------------------------------------------------
# 3. User media (custom location on the shared volume, e.g. /media/).
#    Files uploaded by users are untrusted: whatever their extension, they must never run
#    as a page (stored XSS). `sandbox` gives them an opaque origin; nosniff stops the
#    browser from guessing a type; they are served as attachments unless they are images.
# ---------------------------------------------------------------------------------------
add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Cross-Origin-Resource-Policy "same-site" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
