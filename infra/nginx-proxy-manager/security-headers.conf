# Security headers for nginx-proxy-manager (TG-45 hardening, see obsidian_vault/convencions/seguretat.md).
# There is a single proxy host (TG-89): the headers of the admin panel and of the user media
# live inside their locations in `static.conf`, because `add_header` in a location drops the
# server-level ones. `always` makes nginx send the header on error responses too.

# ---------------------------------------------------------------------------------------
# API (proxy_pass to the FastAPI container): paste into the "Advanced" tab of the proxy host.
#    The API already sends its own headers (nosniff, CSP default-src 'none', no-store on
#    /api/auth and /api/users). Here only HSTS is added, because TLS ends in this proxy.
# ---------------------------------------------------------------------------------------
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
