# WebSocket upgrade for the chat path `/api/ws` (TG-89, criterion 6). The endpoint arrives with TG-63.
# Paste it into the "Advanced" tab of the same proxy host as `static.conf`, and turn on
# "Websockets Support"; see the "nginx-proxy-manager" section of infra/README.md.
# `$forward_scheme`, `$server` and `$port` are set by NPM from the proxy host (http, api, 8000),
# so this location goes to the same upstream as NPM's own `location /`.
# No `add_header` here, so the server-level HSTS still applies.
location /api/ws {
    proxy_pass $forward_scheme://$server:$port;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # A chat connection can stay idle for a long time: do not close it after nginx's default 60 s.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
