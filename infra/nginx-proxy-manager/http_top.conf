# Rate limit zone for the public events endpoints (TG-351, task #477).
# `limit_req_zone` only works in the `http` context, which NPM's "Advanced" tab cannot reach.
# NPM includes /data/nginx/custom/http_top.conf at the top of `http`; infra/docker-compose.yml
# mounts this file there read-only. The location that uses the zone is in `rate-limit.conf`.
#
# `$binary_remote_addr` is the client IP after NPM's real_ip rewrite. 10 MB hold ~160k IPs.
# 1 r/s = 60 requests per minute per IP; the burst is set where the zone is used.
limit_req_zone $binary_remote_addr zone=events_per_ip:10m rate=1r/s;
