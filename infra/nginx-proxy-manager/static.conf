# Static files served by nginx-proxy-manager itself, without going through the API (TG-89).
# Paste this whole file into the "Advanced" tab (Custom Nginx Configuration) of the single
# proxy host that forwards to `api:8000`; see the "nginx-proxy-manager" section of infra/README.md.
# The longer prefixes win over the `location /` that NPM generates, so `/api/...` still goes to `api`.
# `add_header` inside a location drops the server-level headers, so each block repeats HSTS.
# `always` makes nginx send the header on error responses too.

# ---------------------------------------------------------------------------------------
# User media: the `media_data` volume, mounted read-only at /media (criterion 7).
#   Files uploaded by users are untrusted: whatever their extension, they must never run
#   as a page (stored XSS). `sandbox` gives them an opaque origin and nosniff stops the
#   browser from guessing a type. Short cache: moderated content must disappear soon.
# ---------------------------------------------------------------------------------------
location /media/ {
    alias /media/;
    expires 1h;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}

# ---------------------------------------------------------------------------------------
# Admin panel: static bundle of the React Native Web SPA in the `admin_dist` volume,
# mounted read-only at /admin (criterion 8). Unknown paths fall back to index.html so the
# SPA resolves its own routes.
#   - script-src 'self': no inline script, no third-party script, no eval.
#   - style-src 'unsafe-inline': react-native-web injects its styles at runtime.
#   - connect-src 'self': the API (and its WebSocket) live on the same origin.
#   - frame-src: only the APOD video players. Adjust if the video hosts change.
#   - tokens live in sessionStorage (ADR-0008): this policy is what keeps scripts away.
# ---------------------------------------------------------------------------------------
location /admin/ {
    alias /admin/;
    try_files $uri $uri/ /admin/index.html;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-src https://www.youtube.com https://apod.nasa.gov; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
