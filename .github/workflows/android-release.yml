name: Android release

# Compila, signa i publica l'APK d'Android (US TG-329).
# - Un tag vX.Y.Z sobre un commit de `main` crea una GitHub Release amb l'APK.
# - A mà (workflow_dispatch): amb publish=false només deixa l'APK com a artifact,
#   per provar el workflow sense crear cap release.
# Un push o PR a `develop` o a una `feature/*` no el dispara.
#
# El repo és públic i aquest workflow té accés a la keystore: cada action va fixada
# pel SHA del commit, els secrets només viuen a l'environment `android-release` i
# el job que té permís d'escriptura no hi té accés.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versió sense la v (p. ex. 0.1.0-test)"
        required: true
        type: string
      publish:
        description: "Crear la GitHub Release (només des de main)"
        required: false
        default: false
        type: boolean

# Dues compilacions mai en paral·lel, i mai se'n cancel·la una a mitges.
concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Compilar i verificar l'APK signat
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: android-release
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      # Públiques: Expo les incrusta a l'APK en compilar. Mai hi van secrets.
      EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_REDIRECT_SCHEME: app.perseida
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Cal tot l'historial per comprovar que el tag és sobre `main`.
          fetch-depth: 0
          persist-credentials: false

      - name: Calcular i validar la versió
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          STRICT='^[0-9]+\.[0-9]+\.[0-9]+$'
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            [[ "$VERSION" =~ $STRICT ]] || { echo "::error::Tag no vàlid: $GITHUB_REF_NAME"; exit 1; }
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
              echo "::error::El tag ha d'estar sobre un commit de main"
              exit 1
            }
          else
            VERSION="$INPUT_VERSION"
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || {
              echo "::error::Versió no vàlida: $VERSION"
              exit 1
            }
            if [ "$INPUT_PUBLISH" = "true" ]; then
              [ "$GITHUB_REF_NAME" = "main" ] || { echo "::error::Només es publica des de main"; exit 1; }
              [[ "$VERSION" =~ $STRICT ]] || { echo "::error::Per publicar cal una versió X.Y.Z"; exit 1; }
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ANDROID_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          # run_number creix a cada execució: cada APK s'instal·la a sobre de l'anterior.
          echo "ANDROID_VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Comprovar secrets i variables
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_RELEASE_CERT_SHA1: ${{ secrets.ANDROID_RELEASE_CERT_SHA1 }}
        run: |
          set -euo pipefail
          MISSING=0
          for NAME in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD ANDROID_RELEASE_CERT_SHA1 EXPO_PUBLIC_API_BASE_URL \
            EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID; do
            if [ -z "${!NAME:-}" ]; then
              echo "::error::Falta $NAME a l'environment android-release"
              MISSING=1
            fi
          done
          exit "$MISSING"

      - name: Instal·lar pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json

      - name: Instal·lar Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.22.1"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # Sense `cache: gradle`: android/ encara no existeix en aquest punt i la cache
      # de setup-java falla si no troba els fitxers de Gradle.
      - name: Instal·lar JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Instal·lar dependències
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Generar el projecte Android
        working-directory: frontend
        run: |
          set -euo pipefail
          pnpm exec expo prebuild --platform android --clean
          # El config plugin fixa la versió de Gradle i el seu checksum (ADR-0029).
          grep -q '^distributionSha256Sum=' android/gradle/wrapper/gradle-wrapper.properties || {
            echo "::error::El config plugin withAndroidRelease no ha fixat Gradle"
            exit 1
          }
          grep '^distributionUrl=' android/gradle/wrapper/gradle-wrapper.properties

      - name: Preparar la keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/perseida-release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Compilar l'APK
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Esborrar la keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/perseida-release.keystore"

      - name: Verificar la signatura i la versió
        env:
          EXPECTED_CERT_SHA1: ${{ secrets.ANDROID_RELEASE_CERT_SHA1 }}
        run: |
          set -euo pipefail
          APK=frontend/android/app/build/outputs/apk/release/app-release.apk
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"

          "$TOOLS/apksigner" verify "$APK"
          ACTUAL="$("$TOOLS/apksigner" verify --print-certs "$APK" \
            | grep -i 'certificate SHA-1 digest:' | head -n 1 \
            | sed 's/.*digest:[[:space:]]*//' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          EXPECTED="$(printf '%s' "$EXPECTED_CERT_SHA1" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          [ "$ACTUAL" = "$EXPECTED" ] || {
            echo "::error::L'APK no està signat amb el certificat de release"
            exit 1
          }

          BADGING="$("$TOOLS/aapt" dump badging "$APK" | head -n 1)"
          echo "$BADGING"
          grep -q "name='app.perseida'" <<< "$BADGING"
          grep -q "versionCode='$ANDROID_VERSION_CODE'" <<< "$BADGING"
          grep -q "versionName='$ANDROID_VERSION_NAME'" <<< "$BADGING"

          mv "$APK" "perseida-v$ANDROID_VERSION_NAME.apk"

      - name: Pujar l'APK com a artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perseida-apk
          path: perseida-v${{ steps.version.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publicar la GitHub Release
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Baixar l'APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: perseida-apk

      - name: Crear la release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "v$VERSION" "perseida-v$VERSION.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Perseida v$VERSION" \
            --generate-notes
