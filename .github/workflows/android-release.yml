
name: Android release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: android-release
    permissions:
      contents: write

    env:
      EXPO_PUBLIC_GOOGLE_REDIRECT_SCHEME: app.perseida
      EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/perseida-release.keystore
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.15.0
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.22.1'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Prepare release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || {
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret in android-release environment"
            exit 1
          }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"

      - name: Diagnose release keystore certificate
        env:
          EXPECTED_CERT_SHA1: ${{ secrets.ANDROID_RELEASE_CERT_SHA1 }}
        run: |
          set -euo pipefail

          KEYSTORE_SHA1="$(keytool -exportcert \
            -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            | sha1sum | awk '{print $1}')"

          EXPECTED="$(printf '%s' "$EXPECTED_CERT_SHA1" \
            | tr -d ':' \
            | tr '[:upper:]' '[:lower:]')"

          echo "Keystore SHA-1: $KEYSTORE_SHA1"
          echo "Configured SHA-1: $EXPECTED"

          if [ -z "$EXPECTED" ]; then
            echo "::error::ANDROID_RELEASE_CERT_SHA1 is missing"
            exit 1
          fi

          if [ "$KEYSTORE_SHA1" != "$EXPECTED" ]; then
            echo "::error::The keystore certificate does not match ANDROID_RELEASE_CERT_SHA1"
            exit 1
          fi

          echo "Keystore certificate matches the configured fingerprint."

      - name: Generate Android project
        working-directory: frontend
        env:
          EXPO_PUBLIC_GOOGLE_REDIRECT_SCHEME: ${{ env.EXPO_PUBLIC_GOOGLE_REDIRECT_SCHEME }}
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ env.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ env.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_API_BASE_URL: ${{ env.EXPO_PUBLIC_API_BASE_URL }}
        run: pnpm exec expo prebuild --platform android --clean

      - name: Configure release signing
        run: |
          set -euo pipefail

          cat >> frontend/android/app/build.gradle <<'GRADLE'

          android {
            signingConfigs {
              release {
                storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
              }
            }
          }
          GRADLE

      - name: Build release APK
        working-directory: frontend/android
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify APK signature and certificate
        env:
          EXPECTED_CERT_SHA1: ${{ secrets.ANDROID_RELEASE_CERT_SHA1 }}
        run: |
          set -euo pipefail

          APK="frontend/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"

          "$APKSIGNER" verify --verbose "$APK"

          CERT_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK")"
          ACTUAL="$(printf '%s\n' "$CERT_OUTPUT" \
            | grep -i 'certificate SHA-1 digest:' \
            | head -n 1 \
            | sed 's/.*digest:[[:space:]]*//' \
            | tr -d ':' \
            | tr '[:upper:]' '[:lower:]')"

          test -n "$ACTUAL" || {
            echo "::error::Could not extract SHA-1 from APK certificate"
            echo "$CERT_OUTPUT"
            exit 1
          }

          EXPECTED="$(printf '%s' "$EXPECTED_CERT_SHA1" \
            | tr -d ':' \
            | tr '[:upper:]' '[:lower:]')"

          test -n "$EXPECTED" || {
            echo "::error::Missing ANDROID_RELEASE_CERT_SHA1 secret in android-release environment"
            exit 1
          }

          echo "APK certificate SHA-1: $ACTUAL"
          echo "Configured certificate SHA-1: $EXPECTED"

          test "$ACTUAL" = "$EXPECTED" || {
            echo "::error::APK certificate SHA-1 does not match the configured release certificate"
            exit 1
          }

          echo "APK signature and release certificate verified."

      - name: Upload APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: perseida-android-${{ github.ref_name }}
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            frontend/android/app/build/outputs/apk/release/app-release.apk \
            --title "Perseida $GITHUB_REF_NAME" \
            --generate-notes
