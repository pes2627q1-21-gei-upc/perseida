
name: Android release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: android-release
    permissions:
      contents: write

    env:
      EXPO_PUBLIC_GOOGLE_REDIRECT_SCHEME: app.perseida
      EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/perseida-release.keystore
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.15.0
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.22.1'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Prepare release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || {
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret in android-release environment"
            exit 1
          }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"

      - name: Verify keystore certificate
        env:
          EXPECTED_CERT_SHA1: ${{ secrets.ANDROID_RELEASE_CERT_SHA1 }}
        run: |
          set -euo pipefail
          ACTUAL="$(keytool -exportcert \
            -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            | sha1sum | awk '{print $1}')"
          EXPECTED="$(printf '%s' "$EXPECTED_CERT_SHA1" \
            | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          echo "Keystore SHA-1: $ACTUAL"
          echo "Configured SHA-1: $EXPECTED"
          test -n "$EXPECTED" || {
            echo "::error::ANDROID_RELEASE_CERT_SHA1 is missing"
            exit 1
          }
          test "$ACTUAL" = "$EXPECTED" || {
            echo "::error::Keystore certificate does not match configured SHA-1"
            exit 1
          }

      - name: Generate Android project
        working-directory: frontend
        env:
          EXPO_PUBLIC_GOOGLE_REDIRECT_SCHEME: ${{ env.EXPO_PUBLIC_GOOGLE_REDIRECT_SCHEME }}
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ env.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ env.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_API_BASE_URL: ${{ env.EXPO_PUBLIC_API_BASE_URL }}
        run: pnpm exec expo prebuild --platform android --clean

      
      - name: Configure release signing
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("frontend/android/app/build.gradle")
          text = path.read_text()

          if "signingConfigs {" not in text:
              android_match = re.search(r'\bandroid\s*\{', text)
              if not android_match:
                  raise SystemExit("No se encuentra el bloque android")

              signing = """
              signingConfigs {
                  release {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          """
              pos = android_match.end()
              text = text[:pos] + signing + text[pos:]

          build_match = re.search(r'\bbuildTypes\s*\{', text)
          if not build_match:
              raise SystemExit("No se encuentra buildTypes")

          def find_block_end(source, opening):
              depth = 1
              for i in range(opening + 1, len(source)):
                  if source[i] == "{":
                      depth += 1
                  elif source[i] == "}":
                      depth -= 1
                      if depth == 0:
                          return i
              raise SystemExit("Bloque Gradle sin cerrar")

          build_open = text.find("{", build_match.start())
          build_end = find_block_end(text, build_open)
          build_body = text[build_open + 1:build_end]

          release_match = re.search(r'\brelease\s*\{', build_body)
          if not release_match:
              raise SystemExit("No se encuentra buildTypes.release")

          release_open = build_body.find("{", release_match.start())
          release_end = find_block_end(build_body, release_open)
          release_body = build_body[release_open + 1:release_end]

          if "signingConfig" in release_body:
              release_body = re.sub(
                  r'^\s*signingConfig\s+.*$',
                  '',
                  release_body,
                  flags=re.MULTILINE,
              )

          release_body += "\n                signingConfig signingConfigs.release\n"
          build_body = (
              build_body[:release_open + 1]
              + release_body
              + build_body[release_end:]
          )
          text = (
              text[:build_open + 1]
              + build_body
              + text[build_end:]
          )

          path.write_text(text)
          print("Configuración de firma release aplicada")
          PY

      - name: Build release APK
        working-directory: frontend/android
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify APK signature and certificate
        env:
          EXPECTED_CERT_SHA1: ${{ secrets.ANDROID_RELEASE_CERT_SHA1 }}
        run: |
          set -euo pipefail
          APK="frontend/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

          CERT_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK")"
          ACTUAL="$(printf '%s\n' "$CERT_OUTPUT" \
            | grep -i 'certificate SHA-1 digest:' \
            | head -n 1 \
            | sed 's/.*digest:[[:space:]]*//' \
            | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          EXPECTED="$(printf '%s' "$EXPECTED_CERT_SHA1" \
            | tr -d ':' | tr '[:upper:]' '[:lower:]')"

          echo "APK certificate SHA-1: $ACTUAL"
          echo "Configured certificate SHA-1: $EXPECTED"

          test -n "$ACTUAL" && test -n "$EXPECTED" || {
            echo "::error::Could not read APK or configured certificate SHA-1"
            exit 1
          }
          test "$ACTUAL" = "$EXPECTED" || {
            echo "::error::APK certificate SHA-1 does not match configured release certificate"
            exit 1
          }

          echo "APK signature and release certificate verified."

      - name: Upload APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: perseida-android-${{ github.ref_name }}
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            frontend/android/app/build/outputs/apk/release/app-release.apk \
            --title "Perseida $GITHUB_REF_NAME" \
            --generate-notes
