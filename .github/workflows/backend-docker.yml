name: Backend Docker build

# =============================================================================
# T219 – Workflow de construcció i publicació de la imatge Docker del backend.
# S'activa quan canvia codi rellevant del backend o el propi workflow.
#
# Disparadors:
#   · push a develop o main     → build + push de la imatge a GHCR.
#   · pull_request cap a develop o main → build sense push (validació).
#   · workflow_dispatch         → execució manual per a proves o redesplegaments.
#
# Filtres de rutes (paths):
#   Només s'executa si el canvi afecta fitxers del backend o el workflow.
#   Evita builds innecessaris quan canvien el frontend, la documentació, etc.
# =============================================================================

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "backend/**"
      - ".github/workflows/backend-docker.yml"

  pull_request:
    branches:
      - main
      - develop
    paths:
      - "backend/**"
      - ".github/workflows/backend-docker.yml"

  workflow_dispatch:

# ── Permisos ──────────────────────────────────────────────────────────────────
# Principi de mínim privilegi: només els permisos estrictament necessaris.
#   · contents: read   → checkout del codi.
#   · packages: write  → push de la imatge a GHCR (T220/T221).
# En PRs des de forks, GitHub redueix automàticament els permisos de `packages`
# a `read`, de manera que el pas de push queda deshabilitat de forma segura.
permissions:
  contents: read
  packages: write

# ── Concurrència ──────────────────────────────────────────────────────────────
# Si arriba un nou push mentre ja hi ha un build en curs per a la mateixa
# branca/PR, cancel·la l'anterior i comença el nou.
# Excepció: `main` mai s'ha de cancel·lar (un CD a meitat pot deixar el
# servidor en estat inconsistent); per això el grup és diferent per a main.
concurrency:
  group: backend-docker-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build i publica imatge Docker del backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout del codi
        uses: actions/checkout@v4

      # ── 2. Login a GHCR ──────────────────────────────────────────────────────
      # Autenticació al GitHub Container Registry (ghcr.io) amb el token
      # automàtic que GitHub injecta a cada execució del workflow.
      #
      # Per què GITHUB_TOKEN i no un PAT?
      #   · Es genera automàticament per a cada run: no caduca, no cal rotar-lo.
      #   · Té l'àmbit mínim necessari (packages:write al repo actual).
      #   · En PRs des de forks, GitHub el talla a read-only: el pas de push
      #     de T222 s'habilitarà condicionalment per evitar errors.
      #
      # Per què només en push/dispatch i no en PR?
      #   Les PRs des de branques del mateix repo SÍ podrien fer push, però
      #   per convenció no publiquem imatges de PRs: només de develop i main.
      #   El condicional `if` evita el login innecessari en PR i protegeix
      #   contra PRs de forks on GITHUB_TOKEN no té packages:write.
      - name: Login a GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 3. Generació de tags ─────────────────────────────────────────────────
      # docker/metadata-action llegeix el context de Git (SHA, branca, tag) i
      # genera automàticament les etiquetes i labels OCI estàndard.
      #
      # Estratègia de tags (per prioritat):
      #
      #   a) git-sha curt (sempre): ghcr.io/org/perseida-api:sha-a1b2c3d
      #      Imatge immutable i traçable → base del rollback (ADR arquitectura-física).
      #
      #   b) Branca (push a develop/main): ghcr.io/org/perseida-api:develop
      #      Permet fer `docker pull perseida-api:develop` sense conèixer el SHA.
      #
      #   c) SemVer (quan el push porta un tag vX.Y.Z):
      #        ghcr.io/org/perseida-api:1.2.3
      #        ghcr.io/org/perseida-api:1.2
      #        ghcr.io/org/perseida-api:1
      #        ghcr.io/org/perseida-api:latest  (només si és el tag més nou)
      #      Permet referenciar versions estables per sprint (SemVer des de 0.1.0).
      #
      # `id: meta` exposa dues sortides que usarà build-push-action (T222):
      #   · steps.meta.outputs.tags   → llista de tags a publicar
      #   · steps.meta.outputs.labels → labels OCI (autor, versió, URL repo…)
      - name: Genera tags i labels de la imatge
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/perseida-api
          tags: |
            # a) SHA curt – sempre present, immutable
            type=sha,prefix=sha-,format=short
            # b) Nom de branca – per a push a develop i main
            type=ref,event=branch
            # c) SemVer complet – quan el push porta un tag vX.Y.Z
            type=semver,pattern={{version}}
            # c) SemVer major.minor – per fixar-se a un minor
            type=semver,pattern={{major}}.{{minor}}
            # c) SemVer major – per fixar-se a un major
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
          labels: |
            org.opencontainers.image.title=perseida-api
            org.opencontainers.image.description=Backend de Perseida (FastAPI, arquitectura hexagonal)
            org.opencontainers.image.vendor=UPC-FIB PES


      # ── 4. Build i push ──────────────────────────────────────────────────────
      # Implementat a T222 (docker/build-push-action amb cache GHA).

      # ── Placeholder de validació ─────────────────────────────────────────────
      # Verifica que el Dockerfile és sintàcticament correcte (hadolint).
      # Substituïble pels passos T220–T222 un cop implementats.
      - name: Lint del Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile
          failure-threshold: warning
